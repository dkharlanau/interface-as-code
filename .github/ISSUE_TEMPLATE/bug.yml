name: Bug report
description: Report deterministic validation, CLI, catalog, import or adapter behavior that is incorrect.
title: "bug: "
body:
  - type: textarea
    id: description
    attributes: {label: Problem, description: What happened and what should have happened?}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Minimal reproduction, description: Use synthetic/redacted data only.}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version, placeholder: "0.3.0"}
    validations: {required: true}
