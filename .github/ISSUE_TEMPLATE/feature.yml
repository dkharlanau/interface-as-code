name: Feature proposal
description: Propose a concrete enterprise integration workflow or interoperability improvement.
title: "feature: "
body:
  - type: textarea
    id: outcome
    attributes: {label: User outcome, description: Which repeated integration task becomes easier or safer?}
    validations: {required: true}
  - type: textarea
    id: example
    attributes: {label: Example scenario, description: Describe a vendor-neutral or synthetic enterprise case.}
    validations: {required: true}
  - type: textarea
    id: boundary
    attributes: {label: Standards/product boundary, description: Which existing standard/tool should remain authoritative?}
