name: Validate interface specifications
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m build
      - run: interface-as-code validate examples
      - run: interface-as-code check examples --fail-on error
      - run: interface-as-code controls examples/sap-mdg-to-s4-customer/interface.yaml -o generated/customer-controls.md
      - run: interface-as-code observability examples/sap-event-mesh-order/interface.yaml -o generated/order-event-observability.md
      - run: interface-as-code test-plan examples/sap-event-mesh-order/interface.yaml -o generated/order-event-tests.md
      - run: interface-as-code export backstage examples/rest-order-api/interface.yaml -o generated/backstage.yaml
      - run: interface-as-code export leanix examples/rest-order-api/interface.yaml -o generated/leanix.yaml
      - run: interface-as-code import-csv examples/reference-landscape/inventory.csv generated/reference-landscape
      - run: interface-as-code validate generated/reference-landscape
      - run: interface-as-code catalog generated/reference-landscape -o generated/reference-catalog

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[mcp]"
      - run: interface-as-code catalog examples -o generated/mcp-catalog
      - run: python -c "from interface_as_code.mcp_server import create_server; server=create_server('generated/mcp-catalog/index.json'); print(type(server).__name__)"
