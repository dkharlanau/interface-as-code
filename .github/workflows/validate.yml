name: Validate interface specifications

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: iac validate examples/sap-mdg-to-s4-customer/interface.yaml
      - run: iac validate examples/rest-order-api/interface.yaml
