name: Validate interface specifications
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run public schema conformance suite
        run: python conformance/run.py --spec-version 1.0
      - run: pytest -q
      - run: python -m build
      - run: interface-as-code validate examples
      - run: interface-as-code check examples --fail-on error
      - run: interface-as-code controls examples/sap-mdg-to-s4-customer/interface.yaml -o generated/customer-controls.md
      - run: interface-as-code observability examples/sap-event-mesh-order/interface.yaml -o generated/order-event-observability.md
      - run: interface-as-code test-plan examples/sap-event-mesh-order/interface.yaml -o generated/order-event-tests.md
      - run: interface-as-code export backstage examples/rest-order-api/interface.yaml -o generated/backstage.yaml
      - run: interface-as-code export leanix examples/rest-order-api/interface.yaml -o generated/leanix.yaml
      - run: interface-as-code import-csv examples/reference-landscape/inventory.csv generated/reference-landscape
      - run: interface-as-code validate generated/reference-landscape
      - name: Check generated reference-landscape readiness
        run: interface-as-code check generated/reference-landscape --format json --fail-on error > generated/reference-readiness.json
      - name: Verify reference-landscape readiness evidence
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          report = json.loads(Path("generated/reference-readiness.json").read_text(encoding="utf-8"))
          assert len(report) == 30, f"expected 30 generated interface reports, got {len(report)}"
          assert all(not item["validation"] for item in report), "reference landscape contains invalid generated specs"
          findings = [finding for item in report for finding in item["findings"]]
          severities = Counter(finding["severity"] for finding in findings)
          print(json.dumps({"interfaces": len(report), "findings": len(findings), "severities": severities}, sort_keys=True))
          PY
      - run: interface-as-code catalog generated/reference-landscape -o generated/reference-catalog
      - name: Build complete reference-landscape review set
        run: python scripts/build_reference_landscape_review.py --output build/reference-landscape-review --force
      - name: Upload reference-landscape review set
        uses: actions/upload-artifact@v4
        with:
          name: interface-reference-landscape-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reference-landscape-review
          if-no-files-found: error
          retention-days: 90

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[mcp]"
      - run: interface-as-code catalog examples -o generated/mcp-catalog
      - run: python -c "from interface_as_code.mcp_server import create_server; server=create_server('generated/mcp-catalog/index.json'); print(type(server).__name__)"