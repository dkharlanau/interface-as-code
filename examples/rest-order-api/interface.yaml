version: "1.0"
interface:
  id: ORDER-API-01
  name: Commerce order submission API
  source: {system: Commerce-Platform, object: Order}
  target: {system: Order-Management, object: SalesOrder}
  mode: sync
  pattern: request-response
  criticality: critical
  lifecycle: active
  tags: [rest, order, api]
ownership: {business: Commerce Operations, technical: Order Platform, support: Order Platform Operations}
trigger: {operation: POST /orders}
contract: {format: REST, content_type: application/json, schema_ref: ./openapi.yaml, version: "2026-08"}
delivery: {guarantee: effectively-once, ordering: none, idempotency: {required: true, key: Idempotency-Key}}
mapping: {profile: order-create}
retry: {strategy: automatic, max_attempts: 3, backoff: exponential}
monitoring:
  owner: Order Platform Operations
  support_route: API operations queue
  business_key: order_id
  signals: [5xx_rate, p95_latency, rejected_orders]
reconciliation: {key: order_id, frequency: hourly, source_of_truth: Commerce-Platform, comparison: Submitted order IDs versus accepted order IDs.}
sla: {expected_latency: 2 seconds, recovery_target: 30 minutes}
security: {authentication: OAuth2, transport_encryption: true, data_classification: confidential, external_exposure: true}
tests: [{id: accepted, description: Valid order is accepted., expected: HTTP 202}]
