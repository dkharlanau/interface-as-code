[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interface-as-code"
version = "0.3.0"
description = "Git-native operational contracts and governance for enterprise integrations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dzmitryi Kharlanau"}]
keywords = ["enterprise-integration", "integration-governance", "apiops", "sap", "openapi", "asyncapi", "gitops"]
dependencies = ["PyYAML>=6.0", "jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]
mcp = ["mcp>=2,<3"]

[project.scripts]
interface-as-code = "interface_as_code.cli:main"
iac = "interface_as_code.cli:main"
interface-as-code-mcp = "interface_as_code.mcp_server:main"

[project.urls]
Homepage = "https://github.com/dkharlanau/interface-as-code"
Documentation = "https://dkharlanau.github.io/interface-as-code/"
Repository = "https://github.com/dkharlanau/interface-as-code"
Issues = "https://github.com/dkharlanau/interface-as-code/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interface_as_code = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
